{{- /* Сотрудники: сетка карточек, порядок — по weight во front matter */ -}}
{{ define "main" }}
  <div class="mx-auto max-w-7xl px-4 py-16 lg:px-8">
    {{ with .Content }}<div class="prose prose-lg mb-12 max-w-3xl">{{ . }}</div>{{ end }}
    <div class="grid gap-8 sm:grid-cols-2 lg:grid-cols-4" data-stagger="100">
      {{ range .Pages.ByWeight }}<div data-animate="zoom-in">{{ partials.Include "cards/person.html" (dict "page" .) }}</div>{{ end }}
    </div>
  </div>
{{ end }}
