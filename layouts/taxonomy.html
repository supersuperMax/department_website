{{- /* Список терминов таксономии (/tags/, /categories/) */ -}}
{{ define "main" }}
  <div class="mx-auto max-w-5xl px-4 py-16">
    <ul class="flex flex-wrap gap-3">
      {{ range .Pages.ByTitle }}
        <li><a href="{{ .RelPermalink }}" class="inline-flex items-center gap-2 bg-white px-4 py-2 ring-1 ring-black/10 transition-colors hover:bg-accent hover:text-white">{{ .LinkTitle }} <span class="text-xs opacity-60">{{ len .Pages }}</span></a></li>
      {{ end }}
    </ul>
  </div>
{{ end }}
