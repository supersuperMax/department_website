# =============================================================================
#  Сайт кафедры — конфигурация Hugo
#  Тема: ananke (git-подмодуль, не редактируется) + переопределения в layouts/
#  Стили: Tailwind CSS v4 (assets/css/main.css), Tachyons из ananke отключён
#  Хостинг: GitHub Pages (baseURL подменяется в CI, см. .github/workflows/hugo.yaml)
# =============================================================================

# Заглушка. В GitHub Actions передаётся --baseURL из actions/configure-pages,
# поэтому сайт работает и как https://<user>.github.io/, и как https://<user>.github.io/<repo>/.
# ВАЖНО: в шаблонах используйте только .RelPermalink / relURL — без ссылок, начинающихся с "/".
baseURL = 'https://supersuperMax.github.io/department_website/'
theme = 'ananke'
title = 'Кафедра … МГУ'
enableRobotsTXT = true
enableGitInfo = false
# не превращать «летняя школа» в «Летняя Школа» в заголовках тегов
capitalizeListTitles = false
timeZone = 'Europe/Moscow'

# ---------------------------------------------------------------- Языки ------
# ru — основной язык, живёт в корне сайта (/), остальные — в /<lang>/.
defaultContentLanguage = 'ru'
defaultContentLanguageInSubdir = false

[languages]
  [languages.ru]
    locale = 'ru-RU'
    label = 'Русский'
    weight = 1
    title = 'Кафедра … МГУ'
    [languages.ru.params]
      description = 'Кафедра … Московского государственного университета имени М. В. Ломоносова'
      department_short = 'Кафедра …'
      university = 'МГУ имени М. В. Ломоносова'
      address = '119991, Москва, Ленинские горы, д. 1'
      email = 'info@example.msu.ru'
      phone = '+7 (495) 000-00-00'
      date_format = '2 January 2006'

  [languages.en]
    locale = 'en-US'
    label = 'English'
    weight = 2
    title = 'Department of … MSU'
    [languages.en.params]
      description = 'Department of … at Lomonosov Moscow State University'
      department_short = 'Department of …'
      university = 'Lomonosov Moscow State University'
      address = '1 Leninskie Gory, Moscow, 119991, Russia'
      email = 'info@example.msu.ru'
      phone = '+7 (495) 000-00-00'
      date_format = 'January 2, 2006'

  # --- Шаблон для новых языков: раскомментируйте, добавьте файлы *.zh.md / *.de.md рядом
  #     с существующими (index.zh.md, _index.zh.md) и создайте i18n/<lang>.toml
  # [languages.zh]
  #   locale = 'zh-CN'
  #   label = '中文'
  #   weight = 3
  #   title = '莫斯科国立大学 … 系'
  #   [languages.zh.params]
  #     description = '…'
  #     department_short = '… 系'
  #     university = '莫斯科国立大学'
  #     date_format = '2006年1月2日'
  #
  # [languages.de]
  #   locale = 'de-DE'
  #   label = 'Deutsch'
  #   weight = 4
  #   title = 'Lehrstuhl für … MSU'
  #   [languages.de.params]
  #     description = '…'
  #     department_short = 'Lehrstuhl für …'
  #     university = 'Lomonossow-Universität Moskau'
  #     date_format = '2. January 2006'

