# ---------------------------------------------------------- Параметры --------
[params]
  mainSections = ['news']
  # Логотип (путь от static/ или assets/). Пусто — выводится текстовое название.
  site_logo = ''
  university_url = 'https://www.msu.ru'
  # Ссылка «Поступающим» в верхней полосе
  admissions_page = '/education'

  [params.animations]
    enable = true           # глобальный выключатель всех анимаций
    reveal = true           # появление блоков при прокрутке (data-animate)
    viewTransitions = true  # плавные переходы между страницами (View Transitions API)
    hideHeaderOnScroll = true
    heroInterval = 7000     # мс между слайдами на главной; 0 — без автопрокрутки
    counters = true         # анимация счётчиков на главной

  # Параметры темы ananke, которые по-прежнему используются
  [params.ananke]
    show_recent_posts = false
    copy_code = true
    # Иконки соцсетей в подвале (партиал темы social/follow.html).
    # Список доступных сетей: themes/ananke/config/_default/params.toml
    [params.ananke.social.follow]
      networks = ['telegram', 'youtube', 'github']
    [params.ananke.social.telegram]
      username = 'msu_example'
    [params.ananke.social.youtube]
      username = 'msu_example'
    [params.ananke.social.github]
      username = 'msu-example'

# ----------------------------------------------- Tailwind (css.TailwindCSS) --
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[module]
  [module.hugoVersion]
    extended = false
    min = '0.160.0'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

# Hugo запускает CLI tailwindcss из node_modules — его нужно явно разрешить.
[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

# ---------------------------------------------------------- Прочее -----------
[pagination]
  pagerSize = 9

[taxonomies]
  tag = 'tags'
  category = 'categories'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  # картинка на отдельной строке рендерится как <figure> (render-image.html), без обёртки <p>
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.parser.attribute]
      block = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[imaging]
  resampleFilter = 'Lanczos'
  anchor = 'Smart'
  [imaging.jpeg]
    quality = 82
  [imaging.webp]
    quality = 80

[outputs]
  home = ['html', 'rss']
  section = ['html', 'rss']
